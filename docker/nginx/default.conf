server {
    listen 80;
    server_name localhost;

    # API -> Laravel (php artisan serve) - timeout largo para Supabase pooler (sync ~4-5m)
    location /api/ {
        proxy_pass http://php:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 360s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        send_timeout 360s;
    }

    # Frontend SPA -> Vite dev (5173) con fallback
    # En prod (npm run build) cambia a: root /usr/share/nginx/html; try_files $uri $uri/ /index.html;
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Si frontend devuelve 404 (ruta SPA), Vite ya resuelve a index.html; para build estático usar try_files
    }
}
